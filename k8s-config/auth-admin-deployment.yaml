apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-admin
  namespace: autorena
  labels:
    app: auth-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-admin
  template:
    metadata:
      labels:
        app: auth-admin
    spec:
      imagePullSecrets:
        - name: gitlab-registry-auth
      containers:
        - name: auth-admin
          image: registry.autorena.ru/autorena/auth-admin-panel/autorena-auth-admin-panel:0.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-admin-secrets
                  key: db-password
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: auth-admin-secrets
                  key: db-user
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: auth-admin-secrets
                  key: db-name
          envFrom:
            - configMapRef:
                name: auth-admin-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5 
