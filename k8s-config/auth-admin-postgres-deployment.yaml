apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-admin-postgres
  namespace: autorena
  labels:
    app: auth-admin-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-admin-postgres
  template:
    metadata:
      labels:
        app: auth-admin-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.8-alpine3.21
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: auth-admin-secrets
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-admin-secrets
                  key: db-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: auth-admin-secrets
                  key: db-name
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: auth-admin-postgres-pvc 